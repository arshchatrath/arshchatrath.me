<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume - Arsh Chatrath</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, Arial, sans-serif;
      }
      body {
        margin: 0;
        background: #020617;
        color: #f8fafc;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.8rem 1rem;
        background: rgba(2, 6, 23, 0.95);
        border-bottom: 1px solid #1e293b;
      }
      .topbar a {
        text-decoration: none;
        color: #06b6d4;
        font-weight: 600;
      }
      iframe {
        display: block;
        width: 100%;
        height: calc(100vh - 56px);
        border: 0;
        background: #fff;
      }
      @media (max-width: 640px) {
        .topbar {
          padding: 0.7rem 0.8rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div>Resume</div>
      <a href="/resume.pdf" download>Download PDF</a>
    </div>
    <iframe src="/resume.pdf" title="Resume PDF"></iframe>
  </body>
</html>
